<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; worker-src 'self' blob:">
  <title>Wireface</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23d97757'/%3E%3Ctext x='32' y='44' font-family='Segoe UI' font-weight='700' font-size='34' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/face/face.css">
</head>
<body class="mode-floating">
  <div id="panel">
    <header id="bar">
      <svg class="grip" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h.01M15 6.5h.01M9 12h.01M15 12h.01M9 17.5h.01M15 17.5h.01"/></svg>
      <span id="name">Claude</span>
      <span id="pill"><span class="dot"></span><span id="state-text">connecting</span></span>
      <span class="spacer"></span>
      <button class="hb" id="btn-new" title="New conversation">
        <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
      <button class="hb" id="btn-settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="hb" id="btn-float" title="Face only (floating)">
        <svg viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5L13 11M10 19.5H4.5V14M4.5 19.5L11 13"/></svg></button>
      <button class="hb" id="btn-quit" title="Quit">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
    </header>
    <div id="stage">
      <div id="bg"></div>
      <canvas id="face"></canvas>
      <div id="caption" aria-live="polite"></div>
      <div id="meter" hidden><canvas id="meter-canvas" aria-label="Voice detector: how far what the microphone hears stands out from the room"></canvas></div>
      <div id="drop"><div class="dropcard">
        <svg viewBox="0 0 24 24"><path d="M12 15.5V4.5M7.5 9L12 4.5 16.5 9M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
        <strong>Drop it here</strong><span>A photo can become the face; text and files go to the agent.</span>
      </div></div>
      <div id="notice" role="status"></div>
      <div id="tip" role="tooltip"></div>
    </div>
    <footer id="tools">
      <div class="dock">
        <button class="tb" id="t-mic" title="Listening"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
        <button class="tb" id="t-voice" title="Voice replies"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button class="tb" id="t-stop" title="Stop"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg></button>
        <button class="tb" id="t-chat" title="Type a message"><svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/></svg></button>
      </div>
    </footer>
    <form id="chat" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Message Claude..." maxlength="8000" aria-label="Message">
      <button type="submit" title="Send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5.5M6 11l6-6 6 6"/></svg></button>
    </form>
    <div id="grip" title="Resize"></div>
  </div>
  <script type="module" src="/static/face/app.js"></script>
</body>
</html>
