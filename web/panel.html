<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- wasm-unsafe-eval, blob: and worker-src: the face finder (MediaPipe) runs here when a portrait or photo is chosen -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; worker-src 'self' blob:">
  <title>Wireface</title>
  <link rel="icon" href="/static/panel/img/wireface.svg">
  <link rel="stylesheet" href="/static/panel/panel.css">
  <link rel="stylesheet" href="/static/panel/tools.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <span id="mark" class="mark" data-state="offline" aria-hidden="true"><span class="core"></span></span>
      <div class="ident">
        <strong id="pname">Wireface</strong>
        <span id="pstate">connecting</span>
      </div>
      <span id="taskbadge" class="badge tasks" hidden></span>
      <span id="skipbadge" class="badge danger" hidden title="The agent acts without asking first">Permissions skipped</span>
      <span id="roombadge" class="badge room" hidden></span>
      <span class="spacer"></span>
      <div class="wbs">
        <button class="wb" id="w-dock" title="Dock to a screen edge" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M14.5 5v14"/></svg></button>
        <button class="wb" id="w-fold" title="Fold away" hidden><svg viewBox="0 0 24 24"><path d="M6.5 7l5 5-5 5M12.5 7l5 5-5 5"/></svg></button>
        <button class="wb" id="w-pin" title="Keep on top" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3H7l3-3zM12 12v9"/></svg></button>
        <button class="wb" id="w-min" title="Minimise"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="wb" id="w-max" title="Maximise"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button class="wb" id="w-close" title="Close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
    </header>
    <div id="dockmenu" class="popmenu" role="menu" hidden>
      <button role="menuitemradio" data-dock="right"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M14.5 5v14"/></svg>Dock right</button>
      <button role="menuitemradio" data-dock="left"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M9.5 5v14"/></svg>Dock left</button>
      <button role="menuitemradio" data-dock=""><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="2.5"/><path d="M8 4.5h8"/></svg>Float</button>
    </div>

    <nav id="tabs" role="tablist" aria-label="Panel">
      <span id="tab-ink" aria-hidden="true"></span>
      <button role="tab" id="tab-btn-activity" data-tab="activity" aria-controls="tab-activity" aria-selected="true" title="Activity">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></button>
      <button role="tab" id="tab-btn-tools" data-tab="tools" aria-controls="tab-tools" aria-selected="false" title="Tools: the agent's MCP servers and skills">
        <svg viewBox="0 0 24 24"><path d="M14.6 4.2a4.6 4.6 0 0 0-4.9 6.2l-5.3 5.3a1.9 1.9 0 0 0 2.7 2.7l5.3-5.3a4.6 4.6 0 0 0 6.2-4.9l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span>Tools</span></button>
      <button role="tab" id="tab-btn-phone" data-tab="phone" aria-controls="tab-phone" aria-selected="false" title="Phone: calls, texts and bookings" hidden>
        <svg viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.4 4.1-2 1.4a12 12 0 0 0 6.4 6.4l1.4-2 4.1 1.4v2.6a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z"/></svg><span>Phone</span></button>
      <button role="tab" id="tab-btn-face" data-tab="face" aria-controls="tab-face" aria-selected="false" title="Face">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.2 10.2v.3M14.8 10.2v.3M8.8 14.2a4.6 4.6 0 0 0 6.4 0"/></svg><span>Face</span></button>
      <button role="tab" id="tab-btn-voice" data-tab="voice" aria-controls="tab-voice" aria-selected="false" title="Voice">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Voice</span></button>
      <button role="tab" id="tab-btn-agent" data-tab="agent" aria-controls="tab-agent" aria-selected="false" title="Agent">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7.5 10l3 2.2-3 2.2M12.5 15h4"/></svg><span>Agent</span></button>
    </nav>

    <main>
      <section id="tab-activity" class="tabpanel" role="tabpanel" aria-labelledby="tab-btn-activity">
        <div id="toolbar">
          <!-- the summary, or Claude Code's own transcript of the session (only offered for Claude Code) -->
          <div id="views" class="seg" role="group" aria-label="View" hidden>
            <button data-view="summary" class="on" aria-pressed="true" title="Summary: what was asked, said and done"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Summary</span></button>
            <button data-view="raw" aria-pressed="false" title="Full transcript: Claude Code's own session file, live, with every tool's complete output"><svg viewBox="0 0 24 24"><path d="M6.5 4h11A1.5 1.5 0 0 1 19 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5v-13A1.5 1.5 0 0 1 6.5 4z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg><span>Raw</span></button>
          </div>
          <div id="filters" class="seg" role="group" aria-label="Show">
            <button data-filter="all" class="on">All</button>
            <button data-filter="conversation">Conversation</button>
            <button data-filter="tools">Tools</button>
            <button data-filter="background">Background</button>
            <button data-filter="errors">Errors</button>
          </div>
          <label class="searchbox">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <input id="search" type="search" placeholder="Search" aria-label="Search the log" autocomplete="off">
          </label>
          <button id="clear" class="iconbtn" title="Clear: hide everything so far (it stays in the log files)" aria-label="Clear the log"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7M10.2 11v5M13.8 11v5"/></svg></button>
          <div id="ttools" hidden></div>
        </div>
        <div id="session" aria-live="polite"></div>
        <div id="log" role="log" aria-live="off" tabindex="0"></div>
        <button id="jump" hidden><svg viewBox="0 0 24 24"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5"/></svg>Jump to latest</button>
        <div id="tlog" role="log" aria-live="off" tabindex="0" hidden></div>
        <button id="tjump" class="jump" hidden></button>
      </section>

      <section id="tab-tools" class="tabpanel" role="tabpanel" aria-labelledby="tab-btn-tools" hidden></section>

      <section id="tab-phone" class="tabpanel scroller" role="tabpanel" aria-labelledby="tab-btn-phone" hidden></section>
      <section id="tab-face" class="tabpanel scroller" role="tabpanel" aria-labelledby="tab-btn-face" hidden></section>
      <section id="tab-voice" class="tabpanel scroller" role="tabpanel" aria-labelledby="tab-btn-voice" hidden></section>
      <section id="tab-agent" class="tabpanel scroller" role="tabpanel" aria-labelledby="tab-btn-agent" hidden></section>
    </main>
    <!-- the agent asking before it acts: shown whichever tab is open -->
    <div id="perm" hidden></div>
    <div id="toast" role="status"></div>
  </div>

  <!-- the docked drawer folded into a slim tab at the screen edge: click anywhere to slide it back out -->
  <button id="rail" hidden aria-label="Open the panel">
    <svg class="chev" viewBox="0 0 24 24"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg>
    <span id="rail-mark" class="mark" data-state="offline"><span class="core"></span></span>
    <span class="fresh-dot" aria-hidden="true"></span>
    <span id="rail-label" class="vlabel">Claude</span>
  </button>
  <script type="module" src="/static/panel/panel.js"></script>
</body>
</html>
